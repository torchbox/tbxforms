[tox]
envlist =
    py39-dj42
    py{310,311}-dj{42,52}
    py312-dj{42,52,60}
    py313-dj{52,60}
    py314-dj{52,60}
skip_missing_interpreters = True
isolated_build = True
basepython = python3

[gh-actions]
python =
    3.9: python3.9
    3.10: python3.10
    3.11: python3.11
    3.12: python3.12
    3.13: python3.13
    3.14: python3.14

[testenv]
allowlist_externals = pytest
setenv =
    PYTHONPATH = {toxinidir}
    DJANGO_SETTINGS_MODULE = tests.settings
deps =
    dj42: Django>=4.2,<5.0
    dj52: Django>=5.2,<6.0
    dj60: Django>=6.0,<6.1
extras = test
commands =
    pytest
