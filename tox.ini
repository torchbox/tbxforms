[tox]
envlist =
    py39-dj42
    py{310,311}-dj{42,52}
    py312-dj{42,52,60}
    py313-dj{52,60}
    py314-dj{52,60}
skip_missing_interpreters = True
isolated_build = True
basepython = python3

[gh-actions]
python =
    3.9: python3.9
    3.10: python3.10
    3.11: python3.11
    3.12: python3.12
    3.13: python3.13
    3.14: python3.14

[testenv]
setenv =
    PYTHONPATH = {toxinidir}
    DJANGO_SETTINGS_MODULE = tests.settings
deps =
    dj42: Django>=4.2,<4.3
    dj52: Django>=5.2,<5.3
    dj60: Django>=6.0,<6.1
    dj42: django-crispy-forms>=2.1,<2.6
    dj52: django-crispy-forms>=2.6,<2.7
    dj60: django-crispy-forms>=2.6,<3.0
    djlint==1.23.3
    pytest==7.0.0
    pytest-icdiff==0.5
    syrupy==4.6.0
extras = test
commands_pre =
    dj42: python -m pip install --force-reinstall "Django>=4.2,<5.0" "django-crispy-forms>=2.1,<2.6"
    dj52: python -m pip install --force-reinstall "Django>=5.2,<6.0" "django-crispy-forms>=2.6,<3.0"
    dj60: python -m pip install --force-reinstall "Django>=6.0,<6.1" "django-crispy-forms>=2.6,<3.0"
commands =
    python -m pytest --assert=plain {posargs}
